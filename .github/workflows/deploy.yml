name: Deploy WebSSH to Unikraft Cloud

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "项目名（实例/服务/镜像同名）"
        required: false
        type: string
        default: "webssh"
      regions:
        description: "部署地区"
        required: false
        type: choice
        default: sin - 新加坡
        options:
          - sin - 新加坡
          - dal - 美国达拉斯
          - fra - 德国法兰克福
          - sfo - 美国旧金山
          - was - 美国华盛顿特区
      memory_mb:
        description: "内存 MB（256 通常足够，默认 512）"
        required: false
        type: string
        default: "512"
      image_ref:
        description: "Docker 镜像（默认 eooce/webssh:latest）"
        required: false
        type: string
        default: "eooce/webssh:latest"

concurrency:
  group: deploy-webssh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      UNIKRAFT_API_TOKEN: ${{ secrets.UNIKRAFT_API_TOKEN }}
      PROJECT_NAME: ${{ inputs.project_name || vars.PROJECT_NAME || 'webssh' }}
      REGIONS: ${{ inputs.regions || vars.DEPLOY_REGIONS || 'sin' }}
      MEMORY_MB: ${{ inputs.memory_mb || vars.MEMORY_MB || '512' }}
      APP_PORT: ${{ vars.APP_PORT || '8888' }}
      # Web 登录认证（强烈建议配置，否则任何人可打开页面去连 SSH）
      WEBSSH_USER: ${{ secrets.WEBSSH_USER || vars.WEBSSH_USER || '' }}
      WEBSSH_PASS: ${{ secrets.WEBSSH_PASS || vars.WEBSSH_PASS || '' }}
      SAVE_PASS: ${{ vars.SAVE_PASS || 'true' }}
      TRACE_KEY: ${{ vars.TRACE_KEY || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 unikraft CLI
        run: |
          VER=v0.4.2
          curl -sL -o /tmp/u.tgz "https://github.com/unikraft-cloud/cli/releases/download/${VER}/unikraft-cli_0.4.2_linux_amd64.tar.gz"
          tar xzf /tmp/u.tgz -C /tmp
          sudo mv /tmp/unikraft /usr/local/bin/unikraft
          unikraft version || true

      - name: 导入 WebSSH 镜像
        run: |
          REF="${{ inputs.image_ref || 'eooce/webssh:latest' }}"
          # 兼容 docker.io 前缀
          case "$REF" in
            ghcr.io/*|docker.io/*) ;;
            *) REF="docker.io/$REF" ;;
          esac
          bash scripts/anyimage.sh "$REF" "${{ env.PROJECT_NAME }}"

      - name: 部署实例
        run: bash scripts/deploy.sh deploy
